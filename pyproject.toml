[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aave-usdc-yield"
version = "0.1.0"
description = "Aave V3 Ethereum USDC instantaneous + realized supply yield from ReserveDataUpdated events"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Connor Cink" }]
dependencies = [
  "web3>=6.0.0",
  "click>=8.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.28.0"]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0.0", "streamlit>=1.28.0", "mcp>=1.0.0"]

[project.scripts]
yield = "aave_usdc_yield.cli:main"
aave-usdc-yield = "aave_usdc_yield.cli:main"
aave-usdc-yield-mcp = "aave_usdc_yield.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aave_usdc_yield = ["abi/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
